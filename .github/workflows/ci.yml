name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "== $f"
            deno check "$f"
          done
