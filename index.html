    -->

    <meta name="theme-color" content="#0d1117" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
